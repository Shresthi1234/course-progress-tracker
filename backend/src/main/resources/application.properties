spring.application.name=course-progress-tracker
server.port=${PORT:8080}

# Use MySQL on Aiven when DB_URL is supplied. Otherwise use H2 for local development.
spring.datasource.url=${DB_URL:jdbc:h2:mem:trackerdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# If a MySQL URL is supplied, Spring Boot selects the MySQL driver based on the JDBC URL.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS: comma-separated frontend origins, e.g. https://your-site.onrender.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
